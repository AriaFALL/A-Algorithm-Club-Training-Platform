<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>选择团队</title><link rel="stylesheet" href="styles.css"><style>body{display:grid;place-items:center;min-height:100vh;padding:24px}.auth-shell{width:min(500px,100%)}.auth-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:30px;box-shadow:var(--shadow)}.auth-card h1{margin:0 0 8px;font-size:25px}.auth-card>p{margin:0 0 24px}.team-list{display:grid;gap:10px;margin-bottom:18px}.team-choice{display:flex;align-items:center;justify-content:space-between;text-align:left;width:100%;padding:15px;border:1px solid var(--line);border-radius:9px;background:#fbfefd}.team-choice:hover{border-color:#8bcfc6;background:var(--teal-soft)}.team-choice strong{display:block}.team-choice small{display:block;color:var(--muted);margin-top:4px}.empty-team-state{padding:16px;border:1px dashed var(--line);border-radius:9px;color:var(--muted);font-size:12px;line-height:1.6}.flow-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.flow-actions button:last-child{grid-column:1/-1}</style></head><body><main class="auth-shell"><section class="auth-card"><p class="kicker">ACCOUNT WORKSPACE</p><h1>选择团队</h1><p class="muted">请选择要进入的团队，也可以加入或创建新的团队。</p><div id="teamList" class="team-list" aria-live="polite"><div class="empty-team-state">正在加载团队…</div></div><div class="flow-actions"><button class="primary-button" id="createTeam" type="button">创建团队</button><button class="secondary-button" id="joinTeam" type="button">加入团队</button><button class="secondary-button" id="logout" type="button">返回登录</button></div><div id="message" class="auth-message" role="status" aria-live="polite"></div></section></main><script src="api.js"></script><script src="team-select.js"></script></body></html>
