<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>加入团队</title><link rel="stylesheet" href="styles.css"><style>body{display:grid;place-items:center;min-height:100vh;padding:24px}.auth-shell{width:min(500px,100%)}.auth-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:30px;box-shadow:var(--shadow)}.auth-card h1{margin:0 0 8px;font-size:25px}.auth-card>p{margin:0 0 24px}.auth-field{display:block;font-size:11px;font-weight:700;margin:0 0 17px}.auth-field input{display:block;width:100%;border:1px solid var(--line);border-radius:8px;padding:12px;margin-top:7px}.auth-field small{display:block;color:var(--muted);font-size:10px;font-weight:400;margin-top:5px;line-height:1.4}.auth-submit{width:100%;margin-top:8px}.back-link{display:block;text-align:center;margin-top:15px;color:var(--teal-dark);font-size:12px}</style></head><body><main class="auth-shell"><section class="auth-card"><p class="kicker">JOIN TEAM</p><h1>加入团队</h1><p class="muted">使用团队邀请码和加入密码加入训练团队。</p><form id="form"><label class="auth-field">团队邀请码<input name="team_code" autocomplete="off" required placeholder="例如：ACM2026"></label><label class="auth-field">加入密码<input name="join_password" autocomplete="off" type="password" required placeholder="团队管理员提供的密码"></label><label class="auth-field">团队昵称<input name="name" autocomplete="nickname" required placeholder="在团队内展示的姓名"></label><label class="auth-field">管理员邀请码（可选）<input name="admin_invite" autocomplete="off" type="password" minlength="6" placeholder="没有则留空"><small>不填写或填写错误时，账号会以普通成员加入。</small></label><button class="primary-button auth-submit" type="submit">加入团队</button></form><a class="back-link" href="/team-select.html">返回团队选择</a><div id="message" class="auth-message" role="status" aria-live="polite"></div></section></main><script src="api.js"></script><script>const f=document.querySelector('#form'),m=document.querySelector('#message');f.addEventListener('submit',async e=>{e.preventDefault();const button=f.querySelector('button');button.disabled=true;button.textContent='正在加入…';m.textContent='';try{const r=await clubApi.request('/api/auth/join',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(f)))});const d=await r.json().catch(()=>({}));if(r.ok)location.href='/team-select.html';else m.textContent=d.error||`加入失败（${r.status}）`}catch(error){m.textContent=error.message||'网络连接失败，请确认网站服务正常'}finally{button.disabled=false;button.textContent='加入团队'}});</script></body></html>
