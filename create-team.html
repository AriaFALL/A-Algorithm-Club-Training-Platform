<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>创建团队</title><link rel="stylesheet" href="styles.css"><style>body{display:grid;place-items:center;min-height:100vh;padding:24px}.auth-shell{width:min(620px,100%)}.auth-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:30px;box-shadow:var(--shadow)}.auth-card h1{margin:0 0 8px;font-size:25px}.auth-card>p{margin:0 0 24px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}.form-grid .wide{grid-column:1/-1}.auth-field{display:block;font-size:11px;font-weight:700;margin:0 0 15px}.auth-field input{display:block;width:100%;border:1px solid var(--line);border-radius:8px;padding:11px 12px;margin-top:7px}.auth-field small{display:block;color:var(--muted);font-size:10px;font-weight:400;margin-top:5px;line-height:1.4}.auth-submit{width:100%;margin-top:8px}@media(max-width:600px){.form-grid{grid-template-columns:1fr}.form-grid .wide{grid-column:auto}}</style></head><body><main class="auth-shell"><section class="auth-card"><p class="kicker">NEW TEAM</p><h1>创建团队</h1><p class="muted">创建后你将自动成为团队创建者，并可以设置训练规则。</p><form id="form"><div class="form-grid"><label class="auth-field">团队名字<input name="team_name" autocomplete="organization" required placeholder="例如：算法社团"></label><label class="auth-field">邀请码<input name="team_code" autocomplete="off" required placeholder="例如：ACM2026"></label><label class="auth-field">学期持续时间（天）<input name="term_days" autocomplete="off" type="number" min="1" value="120" required></label><label class="auth-field">每周积分要求<input name="min_score" autocomplete="off" type="number" min="0" value="10" required></label><label class="auth-field">截图积分<input name="screenshot_points" autocomplete="off" type="number" min="0" value="1" required></label><label class="auth-field">注解积分<input name="logic_points" autocomplete="off" type="number" min="0" value="1" required></label><label class="auth-field">Blog积分<input name="blog_points" autocomplete="off" type="number" min="0" value="1" required></label><label class="auth-field">团队加入密码<input name="join_password" autocomplete="new-password" type="password" minlength="8" required placeholder="至少 8 位"></label><label class="auth-field wide">管理员邀请码<input name="admin_invite" autocomplete="new-password" type="password" minlength="6" required placeholder="至少 6 位，仅用于开放管理员权限"><small>成员加入时默认是普通成员；只有输入此邀请码才会成为管理员。</small></label></div><button class="primary-button auth-submit" type="submit">创建团队</button></form><div id="message" class="auth-message" role="status" aria-live="polite"></div></section></main><script src="api.js"></script><script>const form=document.querySelector('#form'),message=document.querySelector('#message');form.onsubmit=async e=>{e.preventDefault();message.textContent='正在创建团队…';try{const r=await clubApi.request('/api/auth/create-team',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(form)))});const d=await r.json().catch(()=>({}));if(r.ok)location.href='/';else message.textContent=d.error||`创建失败（${r.status}）`}catch(error){message.textContent=error.message||'网络连接失败，请确认网站服务正常'}};</script></body></html>
